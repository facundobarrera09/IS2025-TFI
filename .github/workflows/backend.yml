name: Tests Backend Java


on:
  pull_request:
    branches: [ "main" ]
    
    paths:
      - 'backend/**' 
  workflow_dispatch:


jobs:
  test-java:
    runs-on: ubuntu-latest

  
    
    steps:
     
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: maven # Esto hace que las descargas sean más rápidas la próxima vez

      - name: Ejecutar Tests con Maven
        run: mvn test
